name: "Liskov Acurast IPFS pin"
description: "Upload exact Acurast artifact bytes through Liskov and verify gateway bytes, or use an explicit proxy, then write a script manifest. Liskov uploads require permissions: id-token: write."
inputs:
  app-name:
    description: "Liskov application ID (also zip manifest name + script-manifest kind)."
    required: true
  organization-id:
    description: "Liskov organization ID; non-secret configuration required on the Liskov upload path."
    required: false
    default: ""
  liskov-url:
    description: "Liskov API base URL for artifact upload intents."
    required: false
    default: "https://api.liskov.proof.computer"
  audience:
    description: "GitHub OIDC audience for Liskov artifact upload intents. Requires permissions: id-token: write."
    required: false
    default: "liskov-artifact-upload"
  authored-manifest-path:
    description: "Optional repository-relative authored policy manifest. Uses its canonical authored digest; when empty, manifest digest is sha256 of the artifact bytes."
    required: false
    default: ""
  working-directory:
    description: "Directory containing dist/ (and where the manifest is written)."
    required: false
    default: "."
  entrypoint:
    description: "Entrypoint bundle filename inside dist/."
    required: false
    default: "app.cjs"
  encryption-mode:
    description: "none or aes-256-gcm-payload-v1 (public bootstrap plus encrypted CommonJS payload)."
    default: "none"
  encryption-secret-id:
    description: "Existing Lockbox secret delivering the code key to LISKOV_CODE_KEY. Key bytes come from LISKOV_CODE_ENCRYPTION_KEY."
    required: false
  extra-files:
    description: "Additional dist/ files to include in the zip (newline/comma separated), e.g. app.cjs when entrypoint is a stage0 bundle.cjs."
    required: false
    default: ""
  restart-policy:
    description: "Acurast manifest restartPolicy."
    required: false
    default: "onFailure"
  artifact-path:
    description: "Optional caller-prepared artifact path, relative to working-directory. Its exact bytes are uploaded instead of constructing a zip."
    required: false
    default: ""
  metadata-path:
    description: "Optional JSON sidecar containing only allowlisted Diagnostic artifact metadata, relative to working-directory."
    required: false
    default: ""
  script-ipfs:
    description: "Optional existing exact ipfs:// CID. Skips upload but still hashes the local artifact bytes."
    required: false
    default: ""
  gateway-url:
    description: "Override the Liskov intent's gateway template, or opt into proxy/reused byte verification. Credential-free HTTPS URL; {cid} is replaced and bytes must match (4 attempts, 10s apart)."
    required: false
    default: ""
  ipfs-endpoint:
    description: "Use this Acurast-proxy endpoint instead of the Liskov upload service; a bearer key for it is read from LISKOV_IPFS_API_KEY."
    required: false
    default: ""
  manifest-name:
    description: "Output manifest path relative to working-directory (default <app-name>-script-manifest.json)."
    required: false
    default: ""
outputs:
  cid:
    description: "The pinned ipfs:// URI."
  digest:
    description: "sha256:<hex> of the uploaded zip."
  manifest-path:
    description: "Path to the written script manifest (feed to artifact-pin-attest)."
  upload-performed:
    description: "true when this run performed an IPFS upload; false when script-ipfs was reused."
  upload-id:
    description: "Liskov upload intent ID; empty on proxy or reused paths."
  upload-path:
    description: "liskov, proxy, or reused."
runs:
  using: "node24"
  main: "dist/index.cjs"
