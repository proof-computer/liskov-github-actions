name: "Liskov artifact-pin attest"
description: "Mint a GitHub OIDC token and POST a GitHub-attested artifact pin to liskov-rs for one or more Applications."
inputs:
  application-id:
    description: "Liskov Application id to attest the pin against (single-target mode)."
    required: false
    default: ""
  build-manifest-path:
    description: "Path to the script manifest produced by the ipfs-pin action."
    required: true
  authored-manifest-path:
    description: "Path to the exact authored V4 manifest or retained V5 source document used for this build (single-target mode)."
    required: false
    default: ""
  targets-path:
    description: "Optional repository-relative JSON file containing a non-empty array of exact {applicationId, authoredManifestPath} targets; mutually exclusive with single-target inputs."
    required: false
    default: ""
  pin-url:
    description: "Artifact-pin URL template ({applicationId} substituted). Defaults to the prod liskov-rs endpoint (or SLIPWAY_ARTIFACT_PIN_URL env)."
    required: false
    default: ""
  audience:
    description: "OIDC token audience."
    required: false
    default: "slipway-artifact-pin"
outputs:
  cid:
    description: "The attested script CID."
  digest:
    description: "The attested bundle digest."
  artifact-version-id:
    description: "The first deterministic artifact-version ID returned by Liskov (preserves single-target compatibility)."
  artifact-version-ids:
    description: "JSON array of deterministic artifact-version IDs returned by Liskov."
  results-json:
    description: "JSON array of {applicationId, artifactVersionId} results."
  target-count:
    description: "Number of successfully attested targets."
runs:
  using: "node24"
  main: "dist/index.cjs"
