name: "Liskov manifest import"
description: "Mint a GitHub OIDC token and import the repo's authored application manifest as a draft."
inputs:
  application-id:
    description: "Liskov Application id the policy belongs to."
    required: true
  manifest-path:
    description: "Path to the authored manifest JSON in the checkout (e.g. .liskov/<app>.manifest.json)."
    required: true
  import-url:
    description: "Policy-import URL template ({applicationId} substituted). Defaults to the prod liskov-rs endpoint (or LISKOV_POLICY_IMPORT_URL env)."
    required: false
    default: ""
  audience:
    description: "OIDC token audience."
    required: false
    default: "slipway-artifact-pin"
outputs:
  authored-digest:
    description: "Canonical digest of the exact authored manifest."
  release-intent-digest:
    description: "Canonical digest of normalized release requirements and builder authority."
runs:
  using: "node24"
  main: "dist/index.cjs"
