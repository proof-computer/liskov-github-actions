name: "Liskov runtime-image upload"
description: "Upload a runtime image bound to a V5 source document (or, in V4 mode, an imported manifest digest pair) through a scoped Liskov Tigris session and finalize its bootstrap artifact."
inputs:
  application-id:
    description: "Liskov Application id."
    required: true
  image-path:
    description: "Local path to the non-empty PRoot image."
    required: true
  manifest-path:
    description: "Repo-relative V5 source document (release.mode: source, runtime.kind: native_image) in the checkout. Mutually exclusive with authored-digest and release-intent-digest; exactly one mode is required."
    required: false
    default: ""
  authored-digest:
    description: "V4 mode; removed when V4 import closes. Server-authoritative raw lowercase SHA-256 digest of the exact authored manifest."
    required: false
    default: ""
  release-intent-digest:
    description: "V4 mode; removed when V4 import closes. Server-authoritative raw lowercase SHA-256 digest of normalized release intent."
    required: false
    default: ""
  bootstrap-mode:
    description: "Bootstrap launcher mode. bridge-probe is restricted by Liskov to its exact internal canary workflow."
    required: false
    default: "standard"
  expected-sha256:
    description: "Optional expected image SHA-256, with or without a sha256: prefix."
    required: false
    default: ""
  source-image-url:
    description: "Optional source image URL included in safe provenance."
    required: false
    default: ""
  liskov-url:
    description: "Liskov service base URL."
    required: false
    default: "https://api.liskov.proof.computer"
  audience:
    description: "GitHub OIDC audience for runtime-image upload authorization."
    required: false
    default: "liskov-runtime-image-upload"
outputs:
  image-digest:
    description: "Uploaded image digest as sha256:<lowercase hex>."
  image-byte-size:
    description: "Uploaded image size in bytes."
  upload-session-id:
    description: "Liskov runtime-image upload-session id."
  image-url:
    description: "Final public-by-capability image URL."
  bootstrap-cid:
    description: "Launchable bootstrap IPFS CID."
  bootstrap-digest:
    description: "Bootstrap bundle digest."
  bootstrap-manifest-digest:
    description: "Bootstrap manifest digest."
  artifact-version-id:
    description: "Deterministic manifest-bound artifact version id."
  artifact-mode:
    description: "Final Liskov artifact mode."
  auto-published:
    description: "Whether finalization automatically published a policy."
  cleanup-status:
    description: "Scoped Tigris credential cleanup status."
  provenance-json:
    description: "Server-authoritative safe GitHub provenance JSON."
  artifact-digest:
    description: "Bootstrap bundle digest a V5 publication names (--artifact-digest). Empty in V4 mode."
  source-repository:
    description: "Verified source repository the artifact was built from. Empty in V4 mode."
  source-ref:
    description: "Verified source ref (--source-ref). Empty in V4 mode."
  source-commit:
    description: "Verified source commit (--source-commit). Empty in V4 mode."
  source-workflow-identity:
    description: "Verified workflow identity (--workflow-identity). Empty in V4 mode."
  binding-revision:
    description: "Source-binding revision the session was fenced against (--binding-revision). Empty in V4 mode."
  revocation-epoch:
    description: "Source-binding revocation epoch the session was fenced against (--revocation-epoch). Empty in V4 mode."
runs:
  using: "node24"
  main: "dist/index.cjs"
