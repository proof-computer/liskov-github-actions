name: Acurast app — build, pin, attest

# Reusable pipeline for a Liskov Acurast app: install -> typecheck/test/build ->
# IPFS-pin (no-spend) -> GitHub-OIDC artifact-pin attest. Caller example:
#
#   jobs:
#     artifact:
#       uses: proof-computer/liskov-github-actions/.github/workflows/acurast-app.yml@v1
#       with: { app-id: uptime-prober, working-directory: uptime-prober }
#       secrets:
#         ACURAST_IPFS_URL: ${{ secrets.ACURAST_IPFS_URL }}
#         ACURAST_IPFS_API_KEY: ${{ secrets.ACURAST_IPFS_API_KEY }}

on:
  workflow_call:
    outputs:
      cid:
        description: "Pinned or reused ipfs:// artifact CID."
        value: ${{ jobs.build-pin-attest.outputs.cid }}
      digest:
        description: "sha256 digest of the exact caller-prepared or generated artifact bytes."
        value: ${{ jobs.build-pin-attest.outputs.digest }}
      build-manifest-path:
        description: "Runner path to the generated build manifest."
        value: ${{ jobs.build-pin-attest.outputs.build-manifest-path }}
      artifact-version-id:
        description: "First artifact-version ID (single-target compatibility)."
        value: ${{ jobs.build-pin-attest.outputs.artifact-version-id }}
      artifact-version-ids:
        description: "JSON array of artifact-version IDs."
        value: ${{ jobs.build-pin-attest.outputs.artifact-version-ids }}
      attestation-results:
        description: "JSON array of applicationId/artifactVersionId results."
        value: ${{ jobs.build-pin-attest.outputs.attestation-results }}
      target-count:
        description: "Number of successfully attested targets."
        value: ${{ jobs.build-pin-attest.outputs.target-count }}
    inputs:
      app-id:
        description: "Liskov Application id (zip/manifest name + artifact-pin target)."
        required: true
        type: string
      working-directory:
        description: "App directory."
        required: false
        type: string
        default: "."
      entrypoint:
        description: "Entrypoint bundle inside dist/."
        required: false
        type: string
        default: "app.cjs"
      extra-files:
        description: "Extra dist/ files to include in the zip (e.g. app.cjs for a stage0 entrypoint)."
        required: false
        type: string
        default: ""
      authored-manifest-path:
        description: "Repository-relative application-manifest V4 path for single-target attestation."
        required: false
        type: string
        default: ""
      prepare-command:
        description: "Optional caller-owned bash command run after the normal build/smoke step in working-directory."
        required: false
        type: string
        default: ""
      artifact-path:
        description: "Optional prepared artifact path relative to working-directory; exact bytes replace generated zip bytes."
        required: false
        type: string
        default: ""
      artifact-metadata-path:
        description: "Optional allowlisted Diagnostic metadata JSON path relative to working-directory."
        required: false
        type: string
        default: ""
      artifact-targets-path:
        description: "Optional repository-relative exact JSON target array; mutually exclusive with authored-manifest-path."
        required: false
        type: string
        default: ""
      script-ipfs:
        description: "Optional existing exact ipfs:// CID; skips upload while retaining local hashing."
        required: false
        type: string
        default: ""
      ipfs-gateway-url:
        description: "Optional credential-free HTTPS gateway URL for exact byte verification; supports {cid} and retries 4 times with 10s delay."
        required: false
        type: string
        default: ""
      upload-manifest-path:
        description: "Optional build-manifest output path relative to working-directory."
        required: false
        type: string
        default: ""
      node-version:
        required: false
        type: string
        default: "24"
      pnpm-version:
        description: "Optional pnpm version override when the caller lacks a packageManager field."
        required: false
        type: string
        default: ""
      smoke:
        description: "Run `pnpm smoke:bundle`."
        required: false
        type: boolean
        default: false
      attest:
        description: "Post the GitHub-OIDC artifact pin after pinning."
        required: false
        type: boolean
        default: true
      pin-url:
        description: "Override the artifact-pin URL template."
        required: false
        type: string
        default: ""
    secrets:
      ACURAST_IPFS_URL:
        required: false
      ACURAST_IPFS_API_KEY:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  build-pin-attest:
    runs-on: ubuntu-latest
    outputs:
      cid: ${{ steps.pin.outputs.cid }}
      digest: ${{ steps.pin.outputs.digest }}
      build-manifest-path: ${{ steps.pin.outputs.manifest-path }}
      artifact-version-id: ${{ steps.attest.outputs.artifact-version-id }}
      artifact-version-ids: ${{ steps.attest.outputs.artifact-version-ids }}
      attestation-results: ${{ steps.attest.outputs.results-json }}
      target-count: ${{ steps.attest.outputs.target-count }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm from caller packageManager
        if: ${{ inputs.pnpm-version == '' }}
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Set up explicit pnpm version
        if: ${{ inputs.pnpm-version != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test
          pnpm build
          if [ "${{ inputs.smoke }}" = "true" ]; then pnpm smoke:bundle; fi

      - name: Prepare caller artifact
        if: ${{ inputs.prepare-command != '' }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"

      - name: IPFS pin (no-spend)
        id: pin
        uses: proof-computer/liskov-github-actions/actions/ipfs-pin@v1
        with:
          app-name: ${{ inputs.app-id }}
          working-directory: ${{ inputs.working-directory }}
          entrypoint: ${{ inputs.entrypoint }}
          extra-files: ${{ inputs.extra-files }}
          artifact-path: ${{ inputs.artifact-path }}
          metadata-path: ${{ inputs.artifact-metadata-path }}
          script-ipfs: ${{ inputs.script-ipfs }}
          gateway-url: ${{ inputs.ipfs-gateway-url }}
          manifest-name: ${{ inputs.upload-manifest-path }}
        env:
          ACURAST_IPFS_URL: ${{ secrets.ACURAST_IPFS_URL }}
          ACURAST_IPFS_API_KEY: ${{ secrets.ACURAST_IPFS_API_KEY }}

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: liskov-${{ inputs.app-id }}-build-manifest-${{ github.run_attempt }}
          path: ${{ steps.pin.outputs.manifest-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attest artifact pin
        id: attest
        if: ${{ inputs.attest }}
        uses: proof-computer/liskov-github-actions/actions/artifact-pin-attest@v1
        with:
          application-id: ${{ inputs.artifact-targets-path == '' && inputs.app-id || '' }}
          build-manifest-path: ${{ steps.pin.outputs.manifest-path }}
          authored-manifest-path: ${{ inputs.artifact-targets-path == '' && inputs.authored-manifest-path || '' }}
          targets-path: ${{ inputs.artifact-targets-path }}
          pin-url: ${{ inputs.pin-url }}
