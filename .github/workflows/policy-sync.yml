name: Liskov manifest import

# Reusable one-liner: when a repo's .liskov manifest changes on main, import it
# into Liskov via the GitHub-OIDC manifest-import route — no
# manual `proof liskov application import` needed. Caller example:
#
#   on:
#     push: { branches: [main], paths: ['.liskov/**'] }
#   permissions: { id-token: write, contents: read }
#   jobs:
#     manifest:
#       uses: proof-computer/liskov-github-actions/.github/workflows/policy-sync.yml@v1
#       with:
#         application-id: slipway-diagnostic
#         manifest-path: .liskov/slipway-diagnostic.policy.json

on:
  workflow_call:
    inputs:
      application-id:
        description: "Liskov Application id the policy belongs to."
        required: true
        type: string
      manifest-path:
        description: "Path to the authored application manifest JSON in the repo."
        required: true
        type: string
      import-url:
        description: "Override the policy-import URL template."
        required: false
        type: string
        default: ""
      liskov-url:
        description: "Liskov service base URL used when import-url is not supplied."
        required: false
        type: string
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Import manifest into Liskov
        uses: proof-computer/liskov-github-actions/actions/policy-import@v1
        with:
          application-id: ${{ inputs.application-id }}
          manifest-path: ${{ inputs.manifest-path }}
          import-url: ${{ inputs.import-url }}
          liskov-url: ${{ inputs.liskov-url }}
