name: Liskov runtime-image upload

on:
  workflow_call:
    inputs:
      application-id:
        description: "Liskov Application id."
        required: true
        type: string
      manifest-path:
        description: "Repo-relative path to the authored V4 runtime-image build manifest."
        required: true
        type: string
      image-url:
        description: "Pinned upstream PRoot image URL to upload unchanged."
        required: true
        type: string
      expected-sha256:
        description: "Optional expected image SHA-256, with or without a sha256: prefix."
        required: false
        type: string
        default: ""
      bootstrap-mode:
        description: "Bootstrap launcher mode. bridge-probe is reserved for the exact Liskov runtime-image canary."
        required: false
        type: string
        default: "standard"
      attestation-repository:
        description: "Artifact attestation repository (owner/repo). Supply with attestation-source-digest and attestation-signer-workflow."
        required: false
        type: string
        default: ""
      attestation-source-digest:
        description: "Exact source commit recorded by the artifact attestation. Supply with the other attestation inputs."
        required: false
        type: string
        default: ""
      attestation-signer-workflow:
        description: "Exact signer workflow identity (owner/repo/.github/workflows/file.yml). Supply with the other attestation inputs."
        required: false
        type: string
        default: ""
      liskov-url:
        description: "Liskov service base URL used for import and upload."
        required: false
        type: string
        default: "https://api.liskov.proof.computer"
      audience:
        description: "GitHub OIDC audience for runtime-image upload authorization."
        required: false
        type: string
        default: "liskov-runtime-image-upload"
    outputs:
      image-digest:
        description: "Uploaded image digest."
        value: ${{ jobs.upload.outputs.image-digest }}
      image-byte-size:
        description: "Uploaded image size."
        value: ${{ jobs.upload.outputs.image-byte-size }}
      upload-session-id:
        description: "Liskov upload-session id."
        value: ${{ jobs.upload.outputs.upload-session-id }}
      image-url:
        description: "Final image URL."
        value: ${{ jobs.upload.outputs.image-url }}
      bootstrap-cid:
        description: "Launchable bootstrap CID."
        value: ${{ jobs.upload.outputs.bootstrap-cid }}
      bootstrap-digest:
        description: "Bootstrap bundle digest."
        value: ${{ jobs.upload.outputs.bootstrap-digest }}
      bootstrap-manifest-digest:
        description: "Bootstrap manifest digest."
        value: ${{ jobs.upload.outputs.bootstrap-manifest-digest }}
      artifact-version-id:
        description: "Manifest-bound artifact version id."
        value: ${{ jobs.upload.outputs.artifact-version-id }}
      artifact-mode:
        description: "Final artifact mode."
        value: ${{ jobs.upload.outputs.artifact-mode }}
      auto-published:
        description: "Whether finalization auto-published."
        value: ${{ jobs.upload.outputs.auto-published }}
      cleanup-status:
        description: "Scoped Tigris credential cleanup status."
        value: ${{ jobs.upload.outputs.cleanup-status }}
      provenance-json:
        description: "Safe GitHub provenance JSON."
        value: ${{ jobs.upload.outputs.provenance-json }}

permissions:
  contents: read
  id-token: write
  attestations: read

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: read
    outputs:
      image-digest: ${{ steps.upload.outputs.image-digest }}
      image-byte-size: ${{ steps.upload.outputs.image-byte-size }}
      upload-session-id: ${{ steps.upload.outputs.upload-session-id }}
      image-url: ${{ steps.upload.outputs.image-url }}
      bootstrap-cid: ${{ steps.upload.outputs.bootstrap-cid }}
      bootstrap-digest: ${{ steps.upload.outputs.bootstrap-digest }}
      bootstrap-manifest-digest: ${{ steps.upload.outputs.bootstrap-manifest-digest }}
      artifact-version-id: ${{ steps.upload.outputs.artifact-version-id }}
      artifact-mode: ${{ steps.upload.outputs.artifact-mode }}
      auto-published: ${{ steps.upload.outputs.auto-published }}
      cleanup-status: ${{ steps.upload.outputs.cleanup-status }}
      provenance-json: ${{ steps.upload.outputs.provenance-json }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate image provenance inputs
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
          ATTESTATION_REPOSITORY: ${{ inputs.attestation-repository }}
          ATTESTATION_SOURCE_DIGEST: ${{ inputs.attestation-source-digest }}
          ATTESTATION_SIGNER_WORKFLOW: ${{ inputs.attestation-signer-workflow }}
        run: |
          set -euo pipefail
          supplied=0
          for value in \
            "${ATTESTATION_REPOSITORY}" \
            "${ATTESTATION_SOURCE_DIGEST}" \
            "${ATTESTATION_SIGNER_WORKFLOW}"
          do
            if [[ -n "${value}" ]]; then
              supplied=$((supplied + 1))
            fi
          done
          if [[ "${supplied}" -ne 0 && "${supplied}" -ne 3 ]]; then
            echo "attestation-repository, attestation-source-digest, and attestation-signer-workflow must be supplied together" >&2
            exit 1
          fi
          if [[ "${supplied}" -eq 3 && -z "${EXPECTED_SHA256}" ]]; then
            echo "expected-sha256 is required when attestation verification is enabled" >&2
            exit 1
          fi
          if [[ "${supplied}" -eq 3 ]]; then
            [[ "${ATTESTATION_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
              echo "attestation-repository must be owner/repo" >&2
              exit 1
            }
            [[ "${ATTESTATION_SOURCE_DIGEST}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || {
              echo "attestation-source-digest must be an exact lowercase Git commit digest" >&2
              exit 1
            }
            expected_workflow_prefix="${ATTESTATION_REPOSITORY}/.github/workflows/"
            [[ "${ATTESTATION_SIGNER_WORKFLOW}" == "${expected_workflow_prefix}"*.yml || \
               "${ATTESTATION_SIGNER_WORKFLOW}" == "${expected_workflow_prefix}"*.yaml ]] || {
              echo "attestation-signer-workflow must identify a workflow in attestation-repository" >&2
              exit 1
            }
          fi

      - name: Download runtime image
        id: download
        shell: bash
        env:
          LISKOV_RUNTIME_IMAGE_SOURCE_URL: ${{ inputs.image-url }}
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent \
            --output "${RUNNER_TEMP}/liskov-runtime-image.tar.zst" \
            "${LISKOV_RUNTIME_IMAGE_SOURCE_URL}"

      - name: Verify expected image digest
        if: ${{ inputs.expected-sha256 != '' }}
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        run: |
          set -euo pipefail
          expected="${EXPECTED_SHA256,,}"
          expected="${expected#sha256:}"
          [[ "${expected}" =~ ^[0-9a-f]{64}$ ]] || {
            echo "expected-sha256 must be 64 hexadecimal characters with an optional sha256: prefix" >&2
            exit 1
          }
          actual="$(sha256sum "${RUNNER_TEMP}/liskov-runtime-image.tar.zst" | cut -d ' ' -f 1)"
          [[ "${actual}" == "${expected}" ]] || {
            echo "runtime image SHA-256 mismatch: expected sha256:${expected}, got sha256:${actual}" >&2
            exit 1
          }

      - name: Verify source-bound artifact attestation
        if: ${{ inputs.attestation-repository != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_REPOSITORY: ${{ inputs.attestation-repository }}
          ATTESTATION_SOURCE_DIGEST: ${{ inputs.attestation-source-digest }}
          ATTESTATION_SIGNER_WORKFLOW: ${{ inputs.attestation-signer-workflow }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "${RUNNER_TEMP}/liskov-runtime-image.tar.zst" \
            --repo "${ATTESTATION_REPOSITORY}" \
            --source-digest "${ATTESTATION_SOURCE_DIGEST}" \
            --signer-workflow "${ATTESTATION_SIGNER_WORKFLOW}"

      - name: Import exact authored manifest
        id: manifest
        uses: proof-computer/liskov-github-actions/actions/policy-import@v1
        with:
          application-id: ${{ inputs.application-id }}
          manifest-path: ${{ inputs.manifest-path }}
          liskov-url: ${{ inputs.liskov-url }}

      - name: Upload and finalize manifest-bound runtime image
        id: upload
        uses: proof-computer/liskov-github-actions/actions/runtime-image-upload@v1
        with:
          application-id: ${{ inputs.application-id }}
          image-path: ${{ runner.temp }}/liskov-runtime-image.tar.zst
          authored-digest: ${{ steps.manifest.outputs.authored-digest }}
          release-intent-digest: ${{ steps.manifest.outputs.release-intent-digest }}
          bootstrap-mode: ${{ inputs.bootstrap-mode }}
          expected-sha256: ${{ inputs.expected-sha256 }}
          source-image-url: ${{ inputs.image-url }}
          liskov-url: ${{ inputs.liskov-url }}
          audience: ${{ inputs.audience }}
